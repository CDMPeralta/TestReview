<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🩺 50 ECG Open Interpretation Challenge ❤️</title>
  <style>
    :root {
      --primary: #0284c7;
      --primary-dark: #0369a1;
      --secondary: #0f172a;
      --bg: #f8fafc;
      --card: #ffffff;
      --ecg-bg: #fff5f5;
      --ecg-grid-major: #f87171;
      --ecg-grid-minor: #fecaca;
      --ecg-trace: #991b1b;
      --correct: #10b981;
      --correct-bg: #ecfdf5;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: #1e293b;
      padding: 16px;
      display: flex;
      justify-content: center;
    }
    .wrapper {
      max-width: 580px;
      width: 100%;
      background: var(--card);
      border-radius: 24px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.08);
      overflow: hidden;
      border: 1px solid #e2e8f0;
    }
    .header {
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 40%, #e11d48 100%);
      color: white;
      padding: 22px 20px 18px;
      text-align: center;
    }
    .header-badge {
      display: inline-block;
      background: rgba(255,255,255,0.22);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .header h1 {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.3px;
    }
    .header p {
      margin-top: 4px;
      font-size: 13px;
      opacity: 0.92;
    }
    .nav-toggle {
      display: flex;
      background: rgba(255,255,255,0.22);
      border-radius: 10px;
      margin-top: 12px;
      padding: 3px;
      gap: 4px;
    }
    .nav-btn {
      flex: 1;
      padding: 8px 10px;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: white;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .nav-btn.active {
      background: white;
      color: var(--primary-dark);
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }
    .progress-wrap {
      background: rgba(255,255,255,0.25);
      height: 6px;
      border-radius: 3px;
      margin-top: 12px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 2%;
      background: #fecdd3;
      transition: width 0.3s ease;
    }
    .content-area {
      padding: 20px;
    }
    .strip-container {
      background-color: var(--ecg-bg);
      border: 1.5px solid var(--ecg-grid-major);
      border-radius: 14px;
      padding: 8px 4px 6px;
      margin-bottom: 16px;
      position: relative;
      background-image: 
        linear-gradient(var(--ecg-grid-major) 1px, transparent 1px),
        linear-gradient(90deg, var(--ecg-grid-major) 1px, transparent 1px),
        linear-gradient(var(--ecg-grid-minor) 0.5px, transparent 0.5px),
        linear-gradient(90deg, var(--ecg-grid-minor) 0.5px, transparent 0.5px);
      background-size: 25px 25px, 25px 25px, 5px 5px, 5px 5px;
    }
    .strip-tag {
      position: absolute;
      top: 6px;
      left: 10px;
      font-size: 10px;
      font-weight: 800;
      color: #b91c1c;
      background: rgba(255,255,255,0.85);
      padding: 2px 6px;
      border-radius: 4px;
    }
    .lead-tag {
      position: absolute;
      top: 6px;
      right: 10px;
      font-size: 11px;
      font-weight: 800;
      color: #1e293b;
      background: rgba(255,255,255,0.85);
      padding: 2px 6px;
      border-radius: 4px;
    }
    .question-prompt {
      font-size: 15px;
      font-weight: 700;
      color: var(--secondary);
      line-height: 1.45;
      margin-bottom: 14px;
    }
    .input-field {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1.5px solid #cbd5e1;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
      margin-bottom: 12px;
    }
    .input-field:focus {
      border-color: var(--primary);
    }
    .reveal-btn {
      width: 100%;
      padding: 12px;
      background: #f8fafc;
      border: 1.5px dashed #94a3b8;
      border-radius: 12px;
      color: #334155;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      margin-bottom: 14px;
      transition: all 0.2s;
    }
    .reveal-btn:hover {
      background: #f1f5f9;
      border-color: var(--primary);
    }
    .answer-box {
      display: none;
      background: #ecfdf5;
      border: 1.5px solid #10b981;
      padding: 14px;
      border-radius: 12px;
      margin-bottom: 14px;
      animation: fadeIn 0.25s ease-in-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .ans-title {
      font-size: 15px;
      font-weight: 800;
      color: #065f46;
      margin-bottom: 6px;
    }
    .ans-pearl {
      font-size: 13px;
      color: #1e293b;
      line-height: 1.45;
    }
    .nav-actions {
      display: flex;
      gap: 8px;
    }
    .action-btn {
      flex: 1;
      padding: 13px;
      background: var(--secondary);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .action-btn:hover { opacity: 0.92; }
    .action-btn.secondary-action {
      background: #e2e8f0;
      color: #334155;
    }
    /* Flashcard / Study list view */
    .study-screen {
      display: none;
      padding: 16px 20px;
      max-height: 80vh;
      overflow-y: auto;
    }
    .study-card {
      border-bottom: 1px solid #e2e8f0;
      padding: 18px 0;
    }
    .study-card:last-child { border-bottom: none; }
    .spoiler-bar {
      background: #0f172a;
      color: #0f172a;
      border-radius: 6px;
      padding: 6px 12px;
      cursor: pointer;
      user-select: none;
      transition: all 0.2s;
      font-size: 13.5px;
      display: inline-block;
      margin-top: 6px;
    }
    .spoiler-bar.revealed {
      background: #ecfdf5;
      color: #065f46;
      font-weight: 700;
      border: 1px solid #10b981;
    }
  </style>
</head>

      <p id="sub-counter">Case 1 of 50</p>
      
      <div class="nav-toggle">

        <button class="nav-btn" id="btn-list-mode" onclick="switchMode('list')">All 50 (Tap to Reveal)</button>
      </div>

      <div class="progress-wrap" id="progress-container">

      <div class="question-prompt" id="question-text"></div>

      <button class="reveal-btn" id="reveal-btn" onclick="revealCurrentAnswer()">🔍 Tap to Reveal Correct Diagnosis</button>
      
      <div class="answer-box" id="answer-box">
        <div class="ans-title" id="ans-diagnosis"></div>
        <div class="ans-pearl" id="ans-pearl"></div>
      </div>

      <div class="nav-actions">
        <button class="action-btn secondary-action" onclick="prevCase()">⬅ Previous</button>
        <button class="action-btn" onclick="nextCase()">Next Case ➔</button>
      </div>
    </div>

    <!-- All-in-One List View -->
    <div class="study-screen" id="list-view"></div>
  </div>

    let current = 0;

    function renderCard() {
      const c = cases[current];
      document.getElementById('sub-counter').innerText = `Case ${current + 1} of ${cases.length}`;
      document.getElementById('progress-bar').style.width = `${((current + 1) / cases.length) * 100}%`;
      document.getElementById('lead-label').innerText = c.lead;
      document.getElementById('svg-mount').innerHTML = c.svg;
      document.getElementById('question-text').innerText = `${current + 1}. ${c.text}`;
      
      document.getElementById('user-input').value = '';
      document.getElementById('answer-box').style.display = 'none';
      document.getElementById('reveal-btn').style.display = 'block';
    }

    function revealCurrentAnswer() {
      const c = cases[current];
      document.getElementById('ans-diagnosis').innerText = `✅ Diagnosis: ${c.diagnosis}`;
      document.getElementById('ans-pearl').innerText = `💡 Clinical Pearl: ${c.pearl}`;
      document.getElementById('answer-box').style.display = 'block';
      document.getElementById('reveal-btn').style.display = 'none';
    }

    function nextCase() {
      if (current < cases.length - 1) {
        current++;
        renderCard();
      } else {
        alert("You finished all 50 cases! Amazing job reviewing! 🎉💖");
      }
    }

    function prevCase() {
      if (current > 0) {
        current--;
        renderCard();
      }
    }

    function switchMode(mode) {
      const cardBtn = document.getElementById('btn-card-mode');
      const listBtn = document.getElementById('btn-list-mode');
      const cardsView = document.getElementById('cards-view');
      const listView = document.getElementById('list-view');
      const pBar = document.getElementById('progress-container');

      if (mode === 'cards') {
        cardBtn.classList.add('active');
        listBtn.classList.remove('active');
        listView.style.display = 'none';
        cardsView.style.display = 'block';
        pBar.style.display = 'block';
        renderCard();
      } else {
        listBtn.classList.add('active');
        cardBtn.classList.remove('active');
        cardsView.style.display = 'none';
        pBar.style.display = 'none';
        buildListView();
        listView.style.display = 'block';
      }
    }

    function buildListView() {
      const mount = document.getElementById('list-view');
      mount.innerHTML = '';
      cases.forEach((c, idx) => {
        const item = document.createElement('div');
        item.className = 'study-card';
        item.innerHTML = `
          <div style="font-size:12px; font-weight:800; color:var(--primary); text-transform:uppercase;">Case ${idx + 1} • ${c.lead}</div>
          <div style="font-size:14px; font-weight:700; margin: 4px 0 8px;">${c.text}</div>
          <div class="strip-container">${c.svg}</div>
          <div>
            <span class="spoiler-bar" onclick="this.classList.toggle('revealed'); if(this.classList.contains('revealed')){ this.innerText = '✅ ' + '${c.diagnosis}'; } else { this.innerText = 'Tap to reveal diagnosis'; }">Tap to reveal diagnosis</span>
          </div>
          <div style="font-size:12.5px; color:#475569; margin-top:8px; line-height:1.4;">💡 ${c.pearl}</div>
        `;
        mount.appendChild(item);
      });
    }

    renderCard();
